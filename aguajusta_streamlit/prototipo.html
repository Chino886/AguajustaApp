<title>Prototipo AguaJusta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700;800&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: app de celular; login en azul petróleo, app en crema con encabezado petróleo oscuro y barra inferior con íconos. Un solo estilo claro, como el diseño del equipo. */
:root{
  --teal:#387D93; --deep:#23474E; --cream:#F4F0E8; --field:#F6F1E9; --surface:#FFFDF9;
  --mint:#BCD6C8; --mint-d:#8DB9A2; --mist:#D3DEE3; --ink:#1F3A40; --muted:#5E7378; --line:#E4DCCD;
  --ok:#2F7F57; --ok-soft:#DCEFE4; --warn:#9C6A10; --warn-soft:#F7EBD2; --bad:#B4434B; --bad-soft:#F7E0E1; --info-soft:#DCEAF0;
  --display:"Raleway","Segoe UI",system-ui,sans-serif;
  --body:"Open Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:is(button,input,select,textarea,a):focus-visible{outline:3px solid #E8B45A;outline-offset:2px}

/* Logo */
.logo{display:flex;align-items:center;gap:12px;color:#fff}
.logo-ic{width:54px;height:54px;border-radius:14px;background:#EAF3F6;display:grid;place-items:center;flex:none}
.logo-t{display:flex;flex-direction:column;line-height:1}
.logo-t b{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.01em}
.logo-t span{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.55em;margin-top:3px}
.logo.sm .logo-ic{width:42px;height:42px;border-radius:11px}
.logo.sm .logo-t b{font-size:26px}.logo.sm .logo-t span{font-size:12px;letter-spacing:.5em}

/* Inicio de sesión */
.auth{min-height:100%;background:var(--teal);display:flex;justify-content:center;padding-block:48px 32px}
.auth-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.auth .logo{margin-bottom:44px}
.auth h1{font-family:var(--display);font-weight:700;font-size:24px;color:#fff;margin:0 0 4px}
.auth input,.auth select{font:16px var(--display);color:var(--ink);background:var(--field);border:0;border-radius:12px;padding:16px 18px;width:100%;box-sizing:border-box}
.auth input::placeholder{color:#9C9A94}
.auth label{color:#fff;font:600 13px var(--display)}
.auth .f{display:flex;flex-direction:column;gap:6px}
.btn-mint{border:0;background:var(--mint);color:var(--deep);font:500 22px var(--display);padding:15px;border-radius:12px;cursor:pointer;margin-top:12px}
.btn-mint:disabled{opacity:.5;cursor:not-allowed}
.auth .link{background:none;border:0;color:#fff;font:400 16px var(--display);cursor:pointer;padding:6px;text-align:center}
.auth .link b{font-weight:700;text-decoration:underline}
.auth .msg{border-radius:10px;padding:10px 12px;font-size:14px;background:rgba(255,255,255,.14);color:#fff}
.auth .msg.no{background:#F7E0E1;color:var(--bad)}
.auth .err{color:#FFE1E3;font-size:14px;margin:0}
.btn-guest{margin-top:0!important;border:2px solid rgba(255,255,255,.75);background:transparent;color:#fff;font:600 18px var(--display);padding:13px;border-radius:12px;cursor:pointer;margin-top:8px}
.btn-guest:hover{background:rgba(255,255,255,.1)}
.auth .hint{color:rgba(255,255,255,.75);font-size:12px;text-align:center;margin:0}

/* App */
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--cream);position:relative}
@media (min-width:600px){.app{margin-block:24px;min-height:calc(100% - 48px);border-radius:32px;overflow:hidden;box-shadow:0 20px 50px rgba(35,71,78,.18)}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--deep);border-radius:0 0 28px 28px;padding-block:16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu-btn{width:48px;height:48px;border:0;border-radius:12px;background:transparent;color:#fff;cursor:pointer;display:grid;place-items:center}
.out-btn{display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.14);color:#fff;font:600 13px var(--display);padding:9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.out-btn:hover{background:rgba(255,255,255,.24)}
@media (max-width:370px){.out-btn{font-size:12px;padding:8px 10px}}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:74px;background:var(--surface);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;min-width:200px;z-index:8}
.menu button{border:0;background:transparent;text-align:left;font:600 15px var(--body);color:var(--ink);padding:12px;border-radius:10px;cursor:pointer}
.menu button:hover{background:var(--cream)}
.menu .cur{color:var(--teal)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.who{color:#C9DCDF;font-size:13px;margin-top:10px}

main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:18px 100px}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:0;color:var(--deep);text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:17px;margin:0;color:var(--deep);text-wrap:balance}
.sub{color:var(--muted);margin:0}
.kicker{font-family:var(--display);font-weight:600;font-size:14px;color:var(--teal)}
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;align-self:flex-start}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--teal)}

.status{display:flex;gap:12px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 6px var(--ok-soft);flex:none}
.cut{background:var(--deep);color:#fff}
.cut h3,.cut .when{color:#fff}
.cut .when{font-family:var(--display);font-weight:800;font-size:22px}
.cut .why{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:14px}
.cut .why b{display:block;font-family:var(--display);color:var(--mint)}
.cut .wa{font-size:13px;color:#C9DCDF}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mini .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1;color:var(--deep)}
.mini .big small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)}
.mini .k{font-size:13px;color:var(--muted);font-weight:600}
.bar{height:12px;background:var(--cream);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--mint-d);border-radius:999px}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--body)}
.chart .hit{cursor:pointer}
.month-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.month-tag{background:var(--teal);color:#fff;font:500 22px var(--display);padding:10px 20px;border-radius:14px}
.total-tag{background:var(--mist);color:var(--deep);font:600 14px var(--display);padding:8px 14px;border-radius:14px;text-align:center;line-height:1.3}
.total-tag b{display:block;font-size:20px;font-weight:800}

.tank{display:flex;gap:16px;align-items:center}
.tank-vis{width:66px;height:88px;border:3px solid var(--teal);border-radius:10px 10px 14px 14px;position:relative;overflow:hidden;flex:none;background:var(--cream)}
.tank-vis>span{position:absolute;inset:auto 0 0 0;background:var(--teal);opacity:.8}
.visit{background:var(--mint);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.visit .cal{background:var(--deep);color:#fff;border-radius:12px;width:56px;flex:none;text-align:center;padding:6px 0;font-family:var(--display)}
.visit .cal b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.visit .cal span{font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.visit p{margin:4px 0 0;font-size:14px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--mist);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;font:600 14px var(--display);color:var(--muted);padding:11px 6px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--deep);color:#fff}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--surface);color:var(--muted);z-index:1}
.steps li.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.now .mk{border-color:var(--teal);color:var(--teal)}
.steps li.done::before{background:var(--ok)}
.steps .d{font-size:13px;color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:0;background:var(--mint);color:var(--deep);font:600 14px var(--display);padding:9px 16px;border-radius:12px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--deep);color:#fff}
.videos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.video{border:0;background:var(--surface);border-radius:18px;padding:0;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;display:flex;flex-direction:column;min-width:0}
.vthumb{aspect-ratio:16/11;max-width:100%;position:relative;display:grid;place-items:center}
.vthumb .play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--deep)}
.vthumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.vthumb .art{position:absolute;left:10px;top:10px;color:rgba(255,255,255,.9)}
.video .vt{padding:10px 12px 12px;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.25;color:var(--deep)}

.player{position:fixed;inset:0;background:rgba(20,40,45,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:440px;border-radius:24px 24px 0 0;display:flex;flex-direction:column;gap:12px;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.screen{aspect-ratio:16/9;max-width:100%;border-radius:16px;position:relative;display:grid;place-items:center;overflow:hidden}
.screen button{width:64px;height:64px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--deep);cursor:pointer;display:grid;place-items:center}
.prog{height:6px;background:rgba(255,255,255,.35);position:absolute;left:0;right:0;bottom:0}
.prog>span{display:block;height:100%;background:#fff;width:0}
.sheet ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.close{align-self:flex-end;border:0;background:var(--mist);color:var(--deep);font:700 14px var(--display);padding:8px 14px;border-radius:999px;cursor:pointer}

form.card{gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.q{font-family:var(--display);font-weight:700;font-size:15px;color:var(--deep)}
main input[type=text],main input[type=number],main select,main textarea{font:16px var(--body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;box-sizing:border-box}
main textarea{min-height:96px;resize:vertical}
main ::placeholder{color:#A09C95}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types label{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:14px;cursor:pointer}
.types input{accent-color:var(--teal)}
.types label:has(input:checked){background:var(--mint);border-color:var(--mint-d)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.two,.videos{grid-template-columns:1fr}}
.btn{border:0;background:var(--teal);color:#fff;font:700 16px var(--display);padding:14px 16px;border-radius:12px;cursor:pointer}
.btn.mint{background:var(--mint);color:var(--deep)}

.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .l{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:12px}
.toast{background:var(--ok-soft);color:var(--ok);border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px}
.toast b{display:block;font-family:var(--display);font-size:16px}

nav.tabs{position:sticky;bottom:0;z-index:5;margin-top:auto;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -4px 16px rgba(35,71,78,.08);display:grid;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:transparent;color:#8FA2A5;font:700 11px var(--display);padding:10px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="page"]{color:var(--deep)}
.proto{text-align:center;font-size:11px;color:var(--muted);margin:0}
</style>

<section class="auth gutter" id="auth">
  <div class="auth-box">
    <div class="logo">
      <span class="logo-ic"><svg width="38" height="42" viewBox="0 0 78 86" aria-hidden="true"><ellipse cx="39" cy="80" rx="30" ry="5" fill="#8EC3EA" opacity=".7"/><path d="M39 4C25 24 11 41 11 55a28 28 0 0 0 56 0C67 41 53 24 39 4Z" fill="#7FB6EA"/><path d="M52 32c5 7 7 12 7 17" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".7"/><circle cx="29" cy="56" r="4" fill="#173A63"/><circle cx="49" cy="56" r="4" fill="#173A63"/><ellipse cx="23" cy="63" rx="4.5" ry="3" fill="#F49BA6"/><ellipse cx="55" cy="63" rx="4.5" ry="3" fill="#F49BA6"/><path d="M35 62q4 4 8 0" stroke="#173A63" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></span>

</section>

<script>
// ---------- Datos de ejemplo (inventados para el prototipo) ----------
const D = {
  usuario:{nombre:"Wilmar", nombreCompleto:"Wilmar Ramírez", cel:"312 456 7890", finca:"Finca La Palma", sector:"Sector Alto", medidor:"MED-0417"},
  meses:["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct"],
  mesesL:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre"],
  consumo:[34,31,36,39,35,33,37,42,46,29], // m³ por mes (octubre va al día 22)
  metaMes:38,
  vereda:{metaAhorro:15, logrado:9, familias:86},
  tanque:{capacidad:2000, nivel:65, lluvia:"Se esperan lluvias el viernes y el sábado."},
  visita:{dia:"4", mes:"nov", fecha:"Martes 4 de noviembre, 9:00 a.m.", quien:"Técnico de la UMATA"},
  videos:[
    {c:"Cultivos",t:"Riegue sin botar agua",m:"4:10",col:"#3E8E6A",i:"leaf",p:["Riegue temprano, antes de las 8 de la mañana, o después de las 5 de la tarde.","Use manguera con huequitos (goteo) en vez de aspersor.","Meta el dedo en la tierra: si está húmeda, no riegue todavía."]},
    {c:"Casa",t:"¿Hay una fuga escondida?",m:"2:45",col:"#387D93",i:"drop",p:["Cierre todas las llaves de la casa.","Mire el contador por 15 minutos.","Si el contador se mueve, hay una fuga. Repórtela en la app."]},
    {c:"Animales",t:"Bebedero que no se rebosa",m:"3:30",col:"#B07D22",i:"cow",p:["Ponga un flotador en el bebedero.","El flotador cierra el agua cuando se llena.","Revise la manguera cada semana."]},

function consumo(){
  const c=D.consumo, i=mesSel, tot=c[i], prev=i>0?c[i-1]:null;
  // Historial mensual
  const W=340,H=190,L=30,B=24,T=12,max=50,cw=(W-L-4)/c.length,bw=cw*.62,y=v=>T+(H-T-B)*(1-v/max);
  let g="";
  [0,10,20,30,40,50].forEach(v=>g+=`<line x1="${L}" x2="${W-2}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  c.forEach((v,k)=>{const x=L+cw*k+(cw-bw)/2;
    g+=`<rect class="hit" data-m="${k}" x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="4" fill="${k===i?"var(--deep)":"var(--mint-d)"}"/>`;
    g+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" ${k===i?'style="fill:var(--deep);font-weight:700"':""}>${D.meses[k]}</text>`;});
  g+=`<line x1="${L}" x2="${W-2}" y1="${y(D.metaMes)}" y2="${y(D.metaMes)}" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  // Detalle del mes por días
  const pesos=[.19,.18,.17,.16,.15,.15].map((p,k)=>p+((i*7+k*3)%5-2)*.006);
  const tramos=i===9?["1-5","6-10","11-15","16-20","21-22"]:["1-5","6-10","11-15","16-20","21-25","26-30"];
  const ps=pesos.slice(0,tramos.length), sp=ps.reduce((a,b)=>a+b,0);
  const vals=ps.map((p,k)=>+(tot*p/sp*(i===9&&k===4?.45:1)).toFixed(1)); const sv=vals.reduce((a,b)=>a+b,0); vals.forEach((v,k)=>vals[k]=+(v*tot/sv).toFixed(1));
  const W2=340,H2=150,m2=Math.max(...vals)*1.25,cw2=(W2-8)/tramos.length,y2=v=>8+(H2-30)*(1-v/m2);
  let g2="";
  vals.forEach((v,k)=>{const x=4+cw2*k+cw2*.14;g2+=`<rect x="${x}" y="${y2(v)}" width="${cw2*.72}" height="${y2(0)-y2(v)}" rx="6" fill="var(--teal)"/><text x="${x+cw2*.36}" y="${y2(v)-5}" text-anchor="middle" style="fill:var(--deep);font-weight:700">${v}</text><text x="${x+cw2*.36}" y="${H2-6}" text-anchor="middle">${tramos[k]}</text>`});
  const dif=prev?Math.round((tot/prev-1)*100):0;
  return `
  <div><div class="kicker">${D.usuario.finca} · Contador ${D.usuario.medidor}</div><h2>Mi consumo</h2></div>
  <div class="card chart">
    <h3>Historial del año</h3>
    <p class="sub" style="font-size:13px">Toque un mes para ver el detalle. La línea roja es la meta: ${D.metaMes} m³ al mes.</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Consumo mensual de enero a octubre">${g}</svg>
  </div>
  <div class="card chart">
    <div class="month-head">
      <span class="month-tag">${D.mesesL[i][0].toUpperCase()+D.mesesL[i].slice(1)}</span>
      <span class="total-tag">Consumo total${i===9?" a la fecha":""}<b class="num">${tot} m³</b></span>
    </div>
    ${prev?`<span class="pill ${dif>0?"bad":"ok"}">${dif>0?"+":""}${dif}% frente a ${D.mesesL[i-1]}</span>`:""}
    <svg viewBox="0 0 ${W2} ${H2}" role="img" aria-label="Consumo por días del mes en metros cúbicos">${g2}</svg>
    <p class="sub" style="font-size:13px">Metros cúbicos por días del mes. 1 m³ = 1.000 litros.</p>
  </div>`;
}

  </ol></div>`;
  return `
  <div><div class="kicker">Agua de lluvia</div><h2>Pida su tanque</h2></div>${sel}
  <p class="sub">Solo necesitamos sus datos y la dirección de la finca.</p>
  <form class="card" id="f-tq">

      <div class="field"><label for="tq-tel">Celular</label><input type="text" id="tq-tel" value="${D.usuario.cel}" inputmode="tel"></div>

    </div>
    <div class="field"><label for="tq-dir">¿Cómo se llega a la finca?</label><textarea id="tq-dir" placeholder="Ej.: Km 4 vía a La Chapa, después de la escuela, portón verde"></textarea></div>
    <button class="btn" type="submit">Pedir mi tanque</button>
  </form>`;

    <div class="field"><label for="al-tipo">Tipo de aviso</label><select id="al-tipo"><option>Corte de agua</option><option>Agua turbia</option><option>Reparación</option><option>Consejo de ahorro</option></select></div>
    <div class="field"><label for="al-sec">Sector</label><select id="al-sec"><option>Sector Alto</option><option>Sector Bajo</option><option>Toda la vereda</option></select></div>
    <div class="field"><label for="al-hora">Horario</label><input type="text" id="al-hora" value="Hoy, de 1:00 a 4:00 p.m."></div>
    <div class="field"><label for="al-causa">¿Por qué?</label><textarea id="al-causa">El tanque de la vereda se vacía cuando muchas fincas riegan en la mañana.</textarea></div>
    <button class="btn" type="submit">Enviar por WhatsApp</button>
  </form>`}`;
}
function reportes(){
  return `
  <div><div class="kicker">Lo que reporta la comunidad</div><h2>Reportes</h2></div>

    ${D.reportes.map(r=>`<div class="row"><div class="l"><b>${r.tipo}</b><small>${r.id} · ${r.lugar} · ${r.f}</small><small style="color:var(--teal);font-weight:600">${r.v}</small></div><span class="pill ${r.e==="Reparado"?"ok":"info"}">${r.e}</span></div>`).join("")}

function cuenta(){
  const u=leer(KEY_U,{})[D.usuario.correo]||{nombre:D.usuario.nombreCompleto,cel:D.usuario.cel,muni:"El Carmen de Viboral"};
  const munis=["El Carmen de Viboral","Rionegro","La Ceja","El Retiro","Guarne","Marinilla","San Vicente Ferrer","La Unión"];
  return `
  <div><div class="kicker">${D.usuario.correo||""}</div><h2>Mi cuenta</h2></div>
  ${cuentaMsg?`<div class="toast">${cuentaMsg}</div>`:""}
  <form class="card" id="f-cuenta">
    <div class="field"><label for="c-nombre">Nombre completo</label><input type="text" id="c-nombre" value="${u.nombre}"></div>
    <div class="field"><label for="c-cel">Celular con WhatsApp</label><input type="text" id="c-cel" value="${u.cel}" inputmode="tel"></div>
    <p class="sub" style="font-size:13px;margin-top:-6px">A este número le llegan los avisos de cortes y las visitas.</p>
    <div class="field"><label for="c-muni">Municipio</label><select id="c-muni">${munis.map(m=>`<option ${m===u.muni?"selected":""}>${m}</option>`).join("")}</select></div>
    ${cuentaErr?`<p class="sub" style="color:var(--bad);font-size:14px">${cuentaErr}</p>`:""}
    <button class="btn" type="submit">Guardar cambios</button>
  </form>
  <div class="card"><div class="list">
    <div class="row"><div class="l"><b>Correo</b><small>${D.usuario.correo||""}</small></div></div>
    <div class="row"><div class="l"><b>Departamento</b><small>Antioquia</small></div></div>
    ${juntaOk?`<div class="row"><div class="l"><b>Junta del acueducto</b><small>Miembro verificado</small></div></div>`:""}
  </div></div>`;
}
const V={cuenta,inicio,consumo,tanques,aprende,reportar,panel,lecturas,cortes,alertas,reportes};

// ---------- Render ----------
function render(){
  $("#view").innerHTML=V[tab]()+`<p class="proto">Prototipo con datos de ejemplo · AguaJusta, Universidad EIA</p>`;
  const t=TABS[rol];
  $("#tabs").style.gridTemplateColumns=`repeat(${t.length},1fr)`;
  $("#tabs").innerHTML=t.map(([k,n,i])=>`<button data-tab="${k}" ${k===tab?'aria-current="page"':""}>${ic(i,26)}${n}</button>`).join("");
  $("#role-fam").className=rol==="fam"?"cur":""; $("#role-jaav").className=rol==="jaav"?"cur":"";
  $("#where").textContent=rol==="fam"?"Vereda El Porvenir · El Carmen de Viboral":"Junta del acueducto · Vereda El Porvenir";
  try{history.replaceState(null,"","#"+tab)}catch(e){}
}
function go(k){tab=k;enviado=null;alertaPub=null;lecturaOk=null;cuentaMsg="";cuentaErr="";render();window.scrollTo(0,0);}
function menu(open){$("#menu").hidden=!open;$("#menu-btn").setAttribute("aria-expanded",open);}

document.addEventListener("click",e=>{
  if(!e.target.closest("#menu,#menu-btn")) menu(false);
  const b=e.target.closest("[data-tab],[data-go],[data-f],[data-v],[data-tq],[data-m]"); if(!b) return;
  if(b.dataset.tab) go(b.dataset.tab);
  else if(b.dataset.go) go(b.dataset.go);
  else if(b.dataset.f){filtro=b.dataset.f;render();}
  else if(b.dataset.v) abrirVideo(+b.dataset.v);
  else if(b.dataset.tq){tieneTanque=b.dataset.tq==="si";render();}
  else if(b.dataset.m){mesSel=+b.dataset.m;render();}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="f-auth") return;
  e.preventDefault();
  if(e.target.id==="f-rep"){const tipo=document.querySelector("input[name=tipo]:checked").value;
    enviado={id:"R-0253",v:"viernes 24 de octubre, entre 8:00 y 11:00 a.m."};
    D.reportes.unshift({id:enviado.id,tipo,lugar:$("#lugar").value,f:"hoy",e:"Visita agendada",v:"Visita: viernes 24 de octubre, 8:00–11:00 a.m."});render();window.scrollTo(0,0);}
  if(e.target.id==="f-al"){alertaPub=true;render();}
  if(e.target.id==="f-cuenta"){
    const nombre=$("#c-nombre").value.trim(), cel=$("#c-cel").value.trim();
    cuentaMsg="";cuentaErr="";
    if(!nombre) cuentaErr="Escriba su nombre.";
    else if(cel.replace(/\D/g,"").length<10) cuentaErr="Escriba un celular de 10 dígitos.";
    else{
      const u=leer(KEY_U,{}), c=D.usuario.correo;
      if(u[c]){u[c].nombre=nombre;u[c].cel=cel;u[c].muni=$("#c-muni").value;guardar(KEY_U,u);}
      D.usuario.nombreCompleto=nombre;D.usuario.nombre=nombre.split(" ")[0];D.usuario.cel=cel;
      cuentaMsg=`Cambios guardados. Los avisos llegarán ahora al ${cel}.`;
    }
    render();window.scrollTo(0,0);}
  if(e.target.id==="f-junta"){
    if($("#j-cod").value.trim().toUpperCase().replace(/\s/g,"")==="JUNTA2026"){
      juntaOk=true;juntaErr="";const u=leer(KEY_U,{});if(u[D.usuario.correo]){u[D.usuario.correo].junta=true;guardar(KEY_U,u);}
    } else juntaErr="Ese código no es válido. Pídalo al presidente o al fontanero de la junta.";
    render();}
  if(e.target.id==="f-lec"){lecturaOk=$("#med").value.split(" · ")[1];render();}
  if(e.target.id==="f-tq"){const v=id=>$("#"+id).value.trim();
    solicitud={id:"ALC-2026-1253",muni:v("tq-muni")};render();window.scrollTo(0,0);}
});
$("#menu-btn").onclick=()=>menu($("#menu").hidden);
$("#role-fam").onclick=()=>{rol="fam";menu(false);go("inicio")};
$("#role-jaav").onclick=()=>{rol="jaav";menu(false);go("panel")};

// ---------- Inicio de sesión (simulado) ----------
$("#a-depto").innerHTML=`<option value="" selected disabled>Elija su departamento</option>`+DEPTOS.map(d=>`<option>${d}</option>`).join("");
function checkDepto(){
  const d=$("#a-depto").value, m=$("#dep-msg");
  if(modo!=="up"){m.hidden=true;$("#a-btn").disabled=false;$("#w-muni").hidden=true;return;}
  if(!d){m.hidden=true;$("#w-muni").hidden=true;$("#a-btn").disabled=true;return;}
  const ok=d==="Antioquia"; m.hidden=false; m.className="msg"+(ok?"":" no");
  m.textContent=ok?"AguaJusta está disponible en Antioquia.":`AguaJusta todavía no llega a ${d}. Por ahora solo funciona en Antioquia.`;
  $("#w-muni").hidden=!ok; $("#a-btn").disabled=!ok;
}
function setModo(m){
  modo=m; const up=m==="up";
  ["#w-nombre","#w-cel","#w-depto"].forEach(s=>$(s).hidden=!up);
  $("#a-title").textContent=up?"Crea tu cuenta":"Bienvenido";
  $("#a-btn").textContent=up?"Registrarme":"Iniciar sesión";
  $("#a-olvido").hidden=up;
  $("#a-switch").innerHTML=up?"¿Ya tienes cuenta? <b>Inicia sesión</b>":"¿No tienes cuenta? <b>Regístrate</b>";
  $("#a-err").hidden=true; checkDepto();
}
// ---------- Cuentas guardadas en este navegador ----------
const KEY_U="aguajusta_usuarios", KEY_S="aguajusta_sesion";
let memoria={};
function leer(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return memoria[k]??def}}
function guardar(k,v){memoria[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function borrar(k){delete memoria[k];try{localStorage.removeItem(k)}catch(e){}}
async function cifrar(t){
  try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("aj:"+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){return "p:"+t}
}
async function usuarios(){
  const u=leer(KEY_U,{});
  if(!u["prueba@aguajusta.co"]){u["prueba@aguajusta.co"]={nombre:"Wilmar Ramírez",cel:"312 456 7890",depto:"Antioquia",muni:"El Carmen de Viboral",clave:await cifrar("agua2026"),creado:"2026-10-01"};guardar(KEY_U,u);}
  return u;
}
function aviso(txt,ok){const er=$("#a-err"),o=$("#a-ok");er.hidden=ok||!txt;o.hidden=!ok||!txt;(ok?o:er).textContent=txt||"";}
function entrar(correo,u){
  juntaOk=!!u.junta; juntaErr="";
  D.usuario.nombreCompleto=u.nombre;D.usuario.nombre=u.nombre.split(" ")[0];D.usuario.cel=u.cel;D.usuario.correo=correo;
  guardar(KEY_S,correo); guardar("aguajusta_ultimo",correo); aviso("");
  $("#auth").hidden=true;$("#app").hidden=false;rol="fam";go("inicio");
}

$("#a-guest").onclick=async()=>{const u=await usuarios();entrar("prueba@aguajusta.co",u["prueba@aguajusta.co"]);borrar(KEY_S);borrar("aguajusta_ultimo");};
$("#a-switch").onclick=()=>{setModo(modo==="in"?"up":"in");aviso("");};
$("#a-olvido").onclick=async()=>{
  const c=$("#a-correo").value.trim().toLowerCase(), u=await usuarios();
  if(!c) return aviso("Escriba su correo arriba y vuelva a tocar “¿Olvidaste tu contraseña?”.");
  if(!u[c]) return aviso("No hay una cuenta con ese correo. Regístrese primero.");
  aviso(`Le enviamos un enlace a ${c} y un mensaje por WhatsApp para crear una contraseña nueva.`,true);
};
$("#a-depto").onchange=checkDepto;
$("#f-auth").onsubmit=async e=>{
  e.preventDefault();
  const correo=$("#a-correo").value.trim().toLowerCase(), clave=$("#a-clave").value;
  const u=await usuarios();
  if(!/^\S+@\S+\.\S+$/.test(correo)) return aviso("Escriba su correo, por ejemplo nombre@correo.com.");
  if(clave.length<4) return aviso("Escriba su contraseña (mínimo 4 caracteres).");
  if(modo==="in"){
    if(!u[correo]){setModo("up");$("#a-correo").value=correo;$("#a-clave").value="";
      return aviso("No encontramos una cuenta con ese correo. Regístrese para poder entrar.");}
    if(u[correo].clave!==await cifrar(clave)) return aviso("La contraseña no es correcta. Intente de nuevo.");
    return entrar(correo,u[correo]);
  }
  // Registro
  const nombre=$("#a-nombre").value.trim(), cel=$("#a-cel").value.trim();
  if(!nombre) return aviso("Escriba su nombre.");
  if(cel.replace(/\D/g,"").length<10) return aviso("Escriba su número de celular con WhatsApp (10 dígitos).");
  if(u[correo]){setModo("in");$("#a-correo").value=correo;$("#a-clave").value="";
    return aviso("Ya existe una cuenta con ese correo. Inicie sesión.",true);}
  u[correo]={nombre,cel,depto:$("#a-depto").value,muni:$("#a-muni").value,clave:await cifrar(clave),creado:new Date().toISOString().slice(0,10)};
  guardar(KEY_U,u);
  setModo("in");$("#a-correo").value=correo;$("#a-clave").value=clave;
  aviso(`Cuenta creada, ${nombre.split(" ")[0]}. Toque “Iniciar sesión” para entrar.`,true);
};
$("#m-cuenta").onclick=()=>{menu(false);go("cuenta")};
$("#logout").onclick=()=>{menu(false);borrar(KEY_S);$("#app").hidden=true;$("#auth").hidden=false;setModo("in");$("#a-correo").value="";$("#a-clave").value="";aviso("");window.scrollTo(0,0);};
setModo("in");
// Si ya había iniciado sesión en este navegador, entra directo; si no, recuerda su correo
(async()=>{const s=leer(KEY_S,null),u=await usuarios(); if(s&&u[s]) entrar(s,u[s]); })();
</script>
